# Release: on a version tag (v0.5.0), check that the tag matches package.json, test, build the release with
# scripts/release.mjs (archives, CLI package, Windows installer with the official Node.js) and attach it to a GitHub
# release.
#
#   https://github.com/marin-ai-tech/skillforge/releases/latest
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install, build and test
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
          node --test --test-concurrency=2 tests/*.test.mjs

      - name: Tools for the Windows installer
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          node_version="$(node -p "process.versions.node")"
          curl -fsSLo "${RUNNER_TEMP}/node.exe" "https://nodejs.org/dist/v${node_version}/win-x64/node.exe"
          echo "SKILLFORGE_NODE_WIN_EXE=${RUNNER_TEMP}/node.exe" >> "${GITHUB_ENV}"

      - name: Build the release
        run: node scripts/release.mjs --skip-build --out dist/release

      - name: GitHub release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # a stable name for releases/latest/download/skillforge-cli.tgz
          cp "dist/release/skillforge-cli-${version}.tgz" dist/release/skillforge-cli.tgz
          # RELEASE-NOTES.md is built from the version's section of CHANGELOG.md
          gh release create "${GITHUB_REF_NAME}" dist/release/* --title "SkillForge ${version}" \
            --notes-file dist/release/RELEASE-NOTES.md

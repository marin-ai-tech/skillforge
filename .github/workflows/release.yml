# Release: on a version tag (v0.5.1), check that the tag matches package.json, test, build the release with
# scripts/release.mjs (archives, CLI package, Windows installer with the official Node.js), attach it to a GitHub
# release and publish the container image ghcr.io/marin-ai-tech/skillforge.
#
#   https://github.com/marin-ai-tech/skillforge/releases/latest
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Test servers on hosted runners (Windows especially) can take longer than the default 30 s to start.
env:
  SKILLFORGE_TEST_START_TIMEOUT_MS: "60000"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # The release tests build the installer too, so the tools come first.
      - name: Tools for the Windows installer
        run: bash .github/scripts/release-tools.sh

      - name: Install, build and test
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
          node --test --test-concurrency=2 tests/*.test.mjs

      - name: Build the release
        run: node scripts/release.mjs --skip-build --out dist/release

      - name: GitHub release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # a stable name for releases/latest/download/skillforge-cli.tgz
          cp "dist/release/skillforge-cli-${version}.tgz" dist/release/skillforge-cli.tgz
          # RELEASE-NOTES.md is built from the version's section of CHANGELOG.md
          gh release create "${GITHUB_REF_NAME}" dist/release/* --title "SkillForge ${version}" \
            --notes-file dist/release/RELEASE-NOTES.md

  # The container image, after the tests and the release passed: ghcr.io/marin-ai-tech/skillforge:<version> and :latest.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/marin-ai-tech/skillforge:${{ steps.meta.outputs.version }}
            ghcr.io/marin-ai-tech/skillforge:latest
          labels: |
            org.opencontainers.image.source=https://github.com/marin-ai-tech/skillforge
            org.opencontainers.image.title=SkillForge
            org.opencontainers.image.description=Self-hosted registry for coding-agent artifacts
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
